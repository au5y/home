<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0c1210" />
  <title>404 — Austin Miller</title>
  <link rel="icon" href="assets/favicon/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      font-family: 'Kalam', cursive;
      background: #0c1210 url('assets/images/adventures/tetons.jpg') center 30%/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      box-sizing: border-box;
    }

    .scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(158, 198, 224, .10), transparent 55%),
        linear-gradient(180deg, rgba(10, 15, 10, .55) 0%, rgba(10, 15, 10, .35) 45%, rgba(10, 15, 10, .75) 100%);
    }

    @keyframes flicker {

      0%,
      100% {
        opacity: .55;
      }

      50% {
        opacity: .85;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .001ms !important;
      }
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 620px;
      text-align: center;
      background: rgba(8, 12, 8, .5);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      border-radius: 26px;
      padding: 36px 44px 40px;
    }

    .kicker {
      font: 11px 'JetBrains Mono', monospace;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #9ecbe8;
      margin-bottom: 14px;
      animation: flicker 3s infinite ease-in-out;
    }

    .code {
      font: 700 clamp(80px, 22vw, 150px) 'Caveat', cursive;
      color: #f4e4b8;
      line-height: .85;
      margin: 0;
      transform: rotate(-2deg);
      text-shadow: 3px 4px 0 rgba(0, 0, 0, .5);
    }

    h1 {
      font: 700 clamp(28px, 6vw, 40px) 'Caveat', cursive;
      color: #f4e4b8;
      margin: 6px 0 12px;
      transform: rotate(-1deg);
    }

    p {
      font: 20px 'Patrick Hand', cursive;
      color: #c7cdb8;
      line-height: 1.45;
      margin: 0 0 28px;
    }

    .trail-svg {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: #f4e4b8;
      font-family: 'Patrick Hand', cursive;
      font-size: 18px;
      padding: 10px 24px;
      border: 2px solid #f4e4b8;
      border-radius: 14px 22px 18px 24px / 22px 14px 24px 18px;
      text-decoration: none;
      transform: rotate(-0.6deg);
      transition: transform .15s, background .15s;
    }

    .btn:hover {
      background: rgba(244, 228, 184, .1);
      transform: rotate(-1.4deg);
    }

    .footer-note {
      margin-top: 30px;
      font: 10px 'JetBrains Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #7a8a80;
    }
  </style>
</head>

<body>

  <div class="scrim" aria-hidden="true"></div>

  <div class="card">
    <div class="kicker">⌖ off-trail · lost</div>

    <p class="code">404</p>

    <h1>Looks like you wandered off the trail.</h1>
    <p>This checkpoint doesn't exist — maybe an old marker, maybe a path that was never blazed. Best bet is to
      head back to camp.</p>

    <div class="trail-svg" aria-hidden="true">
      <svg width="220" height="26" viewBox="0 0 220 26">
        <path d="M4 20 C 30 6, 60 24, 90 12 S 150 4, 180 16 S 210 8, 216 14" stroke="#c0392b" stroke-width="2.5"
          fill="none" stroke-linecap="round" stroke-dasharray="7 7" opacity="0.75" />
      </svg>
    </div>

    <a class="btn" href="/">↺ back to base camp</a>

    <div class="footer-note">error 404 · elevation unknown</div>
  </div>

</body>

</html>
