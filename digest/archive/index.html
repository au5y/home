<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digest Archive — Austin's Daily Digest</title>
<style>
  :root{
    --bg:#17181C; --wash:#1E2024; --ink:#EDEBE6; --ink-soft:#A6A49B; --ink-grey:#6E6D66;
    --hairline:#2E3036; --clay:#E0835F; --clay-hover:#EC9A79;
  }
  body.light-mode{
    --bg:#FCFCFB; --wash:#F9F9F7; --ink:#2E2C27; --ink-soft:#6B6A63; --ink-grey:#B4B3A8;
    --hairline:#E4E3DC; --clay:#C6613F; --clay-hover:#AE5133;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;
  }
  .band{padding:28px 20px;}
  .band.top{background:var(--wash); border-bottom:1px solid var(--hairline);}
  .wrap{max-width:700px; margin:0 auto;}
  h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-weight:600; font-size:30px; margin:0 0 6px 0; color:var(--ink);
  }
  .sub{color:var(--ink-soft); font-size:14px; margin-bottom:6px; max-width:560px;}
  .backlink{display:inline-block; margin-top:14px; font-size:13px; color:var(--ink-soft); text-decoration:none; border:1px solid var(--hairline); padding:7px 13px; border-radius:8px;}
  .backlink:hover{color:var(--ink); border-color:var(--clay);}
  #themeToggle{
    border:1px solid var(--hairline); background:var(--bg); color:var(--ink);
    font-size:13px; padding:7px 13px; border-radius:8px; cursor:pointer;
    font-family:inherit; margin-top:14px; margin-left:10px;
  }
  #themeToggle:hover{border-color:var(--clay);}
  main{padding:30px 20px 60px;}
  ul{list-style:none; margin:0; padding:0; max-width:700px; margin:0 auto;}
  li{border-bottom:1px solid var(--hairline);}
  li:last-child{border-bottom:none;}
  a.entry{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 4px; text-decoration:none; color:var(--ink);
  }
  a.entry:hover .entry-date{color:var(--clay);}
  .entry-date{font-weight:600; font-size:15px;}
  .entry-arrow{color:var(--ink-grey); font-size:14px;}
  .empty{color:var(--ink-soft); font-size:14px; padding:20px 4px;}
</style>
</head>
<body>

<div class="band top">
  <div class="wrap">
    <h1>Digest Archive</h1>
    <div class="sub">Every past edition of Austin's Daily Digest, newest first.</div>
    <a class="backlink" href="/digest/">← Back to today's digest</a>
    <button id="themeToggle">☀ Light mode</button>
  </div>
</div>

<main>
  <ul id="archiveList">
    <li><a class="entry" href="/digest/archive/2026-08-24.html"><span class="entry-date">Monday, August 24, 2026</span><span class="entry-arrow">→</span></a></li>
  </ul>
</main>

<script>
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const isLight = document.body.classList.toggle('light-mode');
    themeToggle.textContent = isLight ? '● Dark mode' : '☀ Light mode';
  });
</script>

</body>
</html>
